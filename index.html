<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TrThinhdzz</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: Arial, sans-serif;
    }

    .text {
        font-size: 60px;
        font-weight: bold;
        color: white;
        animation: glow 2s infinite alternate, move 3s infinite ease-in-out;
    }

    @keyframes glow {
        from {
            text-shadow: 0 0 10px #00ffff;
        }
        to {
            text-shadow: 
                0 0 20px #00ffff,
                0 0 40px #0088ff;
        }
    }

    @keyframes move {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-15px);
        }
    }
</style>

</head>

<body>

<div class="text">
    TrThinhdzz
</div>

</body>
</html>
